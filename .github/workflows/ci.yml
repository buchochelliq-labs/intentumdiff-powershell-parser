name: CI

on:
  push:
    branches: ["main", "fix/0.0.2-windows-arm64-cranelift-function-size"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: buchochelliq-labs/intentumdiff-plugin-sdk/.github/workflows/parser-ci.yml@main
    secrets: inherit

  windows-arm64-component-load:
    name: Verify Windows ARM64 Wasmtime 47.0.3 compile
    needs: ci
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Set up native ARM64 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Download exact candidate Wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parser-wasm
          path: wasm
      - name: Install the host-matching Wasmtime 47.0.3 ARM64 bindings
        run: |
          python -m pip install --only-binary=:all: wasmtime==47.0.3
      - name: Compile exact Wasm component on real Windows ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($arch -ne "Arm64") { throw "Expected ARM64 runner, got $arch" }
          $components = @(Get-ChildItem -Path wasm -Filter *.wasm -File)
          if ($components.Count -ne 1) { throw "Expected one parser Wasm, found $($components.Count)" }
          Get-FileHash -Algorithm SHA256 $components[0].FullName
          $env:PARSER_WASM_PATH = $components[0].FullName
          python -c "import importlib.metadata as md; import os; from wasmtime import Engine; from wasmtime.component import Component; assert md.version('wasmtime') == '47.0.3'; Component.from_file(Engine(), os.environ['PARSER_WASM_PATH']); print('PowerShell component compiled by Wasmtime 47.0.3 on Windows ARM64')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
