name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: buchochelliq-labs/intentumdiff-plugin-sdk/.github/workflows/parser-ci.yml@main
    secrets: inherit

  build-component:
    name: Build exact candidate component
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and Wasm target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.95.0"
          targets: wasm32-wasip2
      - name: Authenticate cross-repo Git dependencies
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - name: Build the candidate PowerShell Wasm
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo build --release --target wasm32-wasip2
      - name: Assert exactly one component
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find target/wasm32-wasip2/release -maxdepth 1 -type f -name "*.wasm")
          test "${#files[@]}" -eq 1
          sha256sum "${files[0]}"
      - name: Upload exactly this built component
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: candidate-powershell-wasm
          path: target/wasm32-wasip2/release/*.wasm
          if-no-files-found: error

  windows-arm64-component-load:
    name: Verify Windows ARM64 Wasmtime 47.0.3 compile
    needs: build-component
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Set up native ARM64 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Download exact candidate Wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-powershell-wasm
          path: wasm
      - name: Install Windows ARM64 Wasmtime CLI
        run: python -m pip install --only-binary=:all: wasmtime-bin==47.0.3
      - name: Compile component on actual Windows ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($arch -ne "Arm64") { throw "Expected ARM64 runner, got $arch" }
          $components = @(Get-ChildItem -Path wasm -Filter *.wasm -File)
          if ($components.Count -ne 1) { throw "Expected one parser Wasm, found $($components.Count)" }
          Get-FileHash -Algorithm SHA256 $components[0].FullName
          wasmtime --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiled = Join-Path $env:RUNNER_TEMP 'powershell-parser.cwasm'
          wasmtime compile $components[0].FullName -o $compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $compiled)) { throw 'Wasmtime reported success without producing compiled output' }
          Write-Host "PowerShell Wasm compiled successfully on Windows ARM64"
