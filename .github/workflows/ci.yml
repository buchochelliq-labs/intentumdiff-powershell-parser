name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: buchochelliq-labs/intentumdiff-plugin-sdk/.github/workflows/parser-ci.yml@main
    secrets: inherit

  windows-arm64-component-load:
    name: Windows ARM64 Wasmtime component compilation
    needs: ci
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Set up ARM64 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Download the exact built component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parser-wasm
          path: wasm

      - name: Install matching Wasmtime runtime
        run: python -m pip install --only-binary=:all: wasmtime==47.0.3

      - name: Compile PowerShell component on Windows ARM64 (must not abort)
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import wasmtime

          components = list(Path("wasm").glob("*.wasm"))
          assert len(components) == 1, components
          config = wasmtime.Config()
          config.wasm_component_model = True
          engine = wasmtime.Engine(config)
          wasmtime.Component.from_file(engine, str(components[0]))
          print("Windows ARM64 Wasmtime component compile succeeded:", components[0])
          '@ | python -
