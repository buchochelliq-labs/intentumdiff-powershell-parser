name: CI

on:
  push:
    branches: ["main", "fix/0.0.2-windows-arm64-cranelift-function-size"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: buchochelliq-labs/intentumdiff-plugin-sdk/.github/workflows/parser-ci.yml@main
    secrets: inherit

  windows-arm64-component-load:
    name: Verify Windows ARM64 metered Wasmtime 48.0.7
    needs: ci
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - name: Checkout exact parser and host probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download exact candidate Wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parser-wasm
          path: wasm
      - name: Install Rust host compiler
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: "1.95.0"
      - name: Compile exact vetted PowerShell component with production fuel metering
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: "false"
          CARGO_INCREMENTAL: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($arch -ne 'Arm64') { throw "Expected Windows ARM64 runner, got $arch" }
          $components = @(Get-ChildItem -Path wasm -Filter *.wasm -File)
          if ($components.Count -ne 1) { throw "Expected one parser Wasm component, found $($components.Count)" }

          # Match the immutable parser bytes approved in registry #13 and Core #187.
          $actual = (Get-FileHash -Algorithm SHA256 $components[0].FullName).Hash.ToLowerInvariant()
          $expected = '29a7be79db83f80627e98da8513a160dc047ea972fae4e3be07d741793a30c15'
          if ($actual -ne $expected) { throw "Unreviewed PowerShell Wasm: expected $expected, got $actual" }

          # This job is no longer gated on vulnerable Wasmtime 47.0.3. The
          # production Core #187 Cargo.toml + Cargo.lock use patched 48.0.7.
          $manifest = Get-Content ci/windows-arm64-host-probe/Cargo.toml -Raw
          if (-not $manifest.Contains('wasmtime = { version = "=48.0.7"')) {
            throw 'Windows ARM64 host probe does not pin patched Wasmtime 48.0.7'
          }

          cargo build --manifest-path ci/windows-arm64-host-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = Join-Path (Get-Location) 'ci/windows-arm64-host-probe/target/debug/intentumdiff-windows-arm64-host-probe.exe'
          if (-not (Test-Path $probe)) { throw 'Production-equivalent Rust host probe was not built' }

          # Rust Core actually calls Config::consume_fuel(true) with
          # wasm_memory64(false). An unmetered CLI compile is not acceptance.
          & $probe $components[0].FullName true speed
          if ($LASTEXITCODE -ne 0) { throw 'Production metered Wasmtime 48.0.7 could not compile PowerShell Wasm' }
          Write-Host "PASS: Windows ARM64 Wasmtime 48.0.7 metered Rust host compiled reviewed $actual"
